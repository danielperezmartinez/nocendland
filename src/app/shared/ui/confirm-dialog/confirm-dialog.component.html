<section class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-message">
  <p class="confirm-dialog__eyebrow">Confirmación</p>
  <h1 id="confirm-dialog-title">{{ data.title }}</h1>
  <p id="confirm-dialog-message">{{ data.message }}</p>

  <footer>
    @if (data.cancelButton?.show !== false) {
      <button class="ui-button ui-button--quiet" type="button" (click)="close(false)">
        {{ data.cancelButton?.text || text.dialogs.cancel }}
      </button>
    }
    @if (data.acceptButton?.show !== false) {
      <button
        class="ui-button"
        type="button"
        [class.ui-button--danger]="data.acceptButton?.intent === 'danger'"
        (click)="close(true)"
      >
        {{ data.acceptButton?.text || text.dialogs.accept }}
      </button>
    }
  </footer>
</section>
