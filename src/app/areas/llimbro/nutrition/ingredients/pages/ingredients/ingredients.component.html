<main class="ingredients-page">
  <header>
    <div>
      <p>Nutrición · catálogo</p>
      <h1>{{ text.ingredients.listTitle }}</h1>
    </div>
    <div class="ingredients-page__actions">
      <button
        class="ui-icon-button"
        type="button"
        [attr.aria-label]="deleteMode() ? 'Salir del modo de borrado' : 'Seleccionar alimentos para borrar'"
        [class.ui-button--danger]="deleteMode()"
        (click)="toggleDeleteMode()"
      >
        <svg class="ui-icon" aria-hidden="true"><use [attr.href]="'icons/atlas-icons.svg#' + (deleteMode() ? 'delete_forever' : 'delete')"/></svg>
      </button>
      <button class="ui-icon-button" type="button" aria-label="Añadir alimento" (click)="navigateToIngredientForm('new')">
        <svg class="ui-icon" aria-hidden="true"><use href="icons/atlas-icons.svg#add"/></svg>
      </button>
    </div>
  </header>

  <section class="ingredients-page__list">
    <app-data-list [config]="ingredientListConfig" [items]="ingredientListItems()"/>
  </section>
</main>
