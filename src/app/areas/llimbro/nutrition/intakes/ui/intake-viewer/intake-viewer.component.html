<section class="intake-dialog" role="dialog" aria-modal="true" aria-labelledby="intake-dialog-title">
  <header class="intake-dialog__header">
    <img
      [src]="currentIntakeJoinIngredient.nutrition_ingredient.image_route"
      [alt]="currentIntakeJoinIngredient.nutrition_ingredient.name"
    >
    <div>
      <p>Detalle de ingesta</p>
      <h1 id="intake-dialog-title">{{ currentIntakeJoinIngredient.nutrition_ingredient.name }}</h1>
      <small>{{ currentIntakeJoinIngredient.nutrition_ingredient.description }}</small>
    </div>
    <button class="ui-icon-button" type="button" aria-label="Cerrar detalle" (click)="dialogRef.close()">
      <svg class="ui-icon" aria-hidden="true"><use href="icons/atlas-icons.svg#close"/></svg>
    </button>
  </header>

  <article class="intake-dialog__content">
    <div class="intake-dialog__fields">
      <label class="ui-field">
        Cantidad (g)
        <input
          #inputQuantity
          class="ui-input"
          type="number"
          [min]="limits.intakeQuantityInGrams.min"
          [max]="limits.intakeQuantityInGrams.max"
          [(ngModel)]="currentIntakeJoinIngredient.quantity_in_grams"
          #quantityModel="ngModel"
          (ngModelChange)="saveChanges(quantityModel.valid)"
        >
      </label>

      <label class="ui-field">
        <span>Unidades <span class="field-help" [attr.title]="text.intakes.unitsExplanation">?</span></span>
        <input
          class="ui-input"
          type="number"
          [min]="limits.intakeUnits.min"
          [max]="limits.intakeUnits.max"
          [(ngModel)]="currentIntakeJoinIngredient.units"
          #unitsModel="ngModel"
          (ngModelChange)="calculateQuantityInGrams(unitsModel.valid)"
        >
      </label>
    </div>

    <div class="intake-dialog__metrics">
      <app-card-data [data]="{ label: 'Calorías', value: math.calculateProportionalValue(currentIntakeJoinIngredient.nutrition_ingredient.calories_per_100 || 0, parseInt(inputQuantity.value)) }"/>
      <app-card-data [data]="{ label: 'Proteínas', value: math.calculateProportionalValue(currentIntakeJoinIngredient.nutrition_ingredient.proteins_per_100 || 0, parseInt(inputQuantity.value)) }"/>
      <app-card-data [data]="{ label: 'Hidratos', value: math.calculateProportionalValue(currentIntakeJoinIngredient.nutrition_ingredient.carbohydrates_per_100 || 0, parseInt(inputQuantity.value)) }"/>
      <app-card-data [data]="{ label: 'Grasas', value: math.calculateProportionalValue(currentIntakeJoinIngredient.nutrition_ingredient.fats_per_100 || 0, parseInt(inputQuantity.value)) }"/>
    </div>
  </article>

  <footer class="intake-dialog__navigation">
    <button class="ui-button ui-button--quiet" type="button" (click)="prevIngredient()">
      <span aria-hidden="true">←</span><span>{{ getPrevIngredientName() }}</span>
    </button>
    <button class="ui-button ui-button--quiet" type="button" (click)="nextIngredient()">
      <span>{{ getNextIngredientName() }}</span><span aria-hidden="true">→</span>
    </button>
  </footer>
</section>
