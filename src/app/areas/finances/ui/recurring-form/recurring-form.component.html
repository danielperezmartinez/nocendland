<form class="finance-dialog" [formGroup]="form" (ngSubmit)="save()">
  <header>
    <div>
      <p class="section-eyebrow">Automatización mensual</p>
      <h2>{{ editing ? 'Editar recurrente' : 'Nuevo recurrente' }}</h2>
    </div>
    <button class="ui-icon-button" type="button" aria-label="Cerrar" (click)="dialogRef.close()">
      <svg class="ui-icon" aria-hidden="true"><use href="icons/atlas-icons.svg#close"/></svg>
    </button>
  </header>

  <div class="finance-dialog__grid">
    <label class="ui-field finance-dialog__wide">Concepto
      <input class="ui-input" formControlName="name" autocomplete="off">
    </label>
    <label class="ui-field">Importe por ocurrencia
      <input class="ui-input finance-data" formControlName="amount" type="number" min="0.01" step="0.01">
    </label>
    <label class="ui-field">Categoría
      <select class="ui-select" formControlName="categoryId">
        @for (category of store.categories(); track category.id) {
          <option [value]="category.id">{{ category.name }}</option>
        }
      </select>
    </label>
    <label class="ui-field">Cada cuántos meses
      <input class="ui-input finance-data" formControlName="intervalMonths" type="number" min="1" max="120" step="1">
    </label>
    <label class="ui-field">Día previsto
      <input class="ui-input finance-data" formControlName="dueDay" type="number" min="1" max="31" step="1">
    </label>
    <label class="ui-field">Comienza
      <input class="ui-input finance-data" formControlName="startsOn" type="date">
    </label>
    <label class="ui-field">Termina · opcional
      <input class="ui-input finance-data" formControlName="endsOn" type="date">
    </label>
    <label class="ui-field">Objetivo vinculado
      <select class="ui-select" formControlName="goalId">
        <option [ngValue]="null">Ninguno</option>
        @for (goal of store.goals(); track goal.id) {
          <option [ngValue]="goal.id">{{ goal.name }}</option>
        }
      </select>
    </label>
    <label class="ui-field finance-dialog__wide">Notas
      <textarea class="ui-textarea" formControlName="notes" rows="3"></textarea>
    </label>
  </div>

  <p class="finance-muted">Las ocurrencias ya creadas seguirán siendo editables de forma independiente.</p>
  @if (error) { <p class="finance-dialog__error" role="alert">{{ error }}</p> }

  <footer>
    @if (editing) {
      <button class="ui-button ui-button--quiet ui-button--danger" type="button" [disabled]="store.saving()" (click)="archive()">Archivar</button>
    } @else { <span></span> }
    <button class="ui-button" type="submit" [disabled]="form.invalid || store.saving()">Guardar</button>
  </footer>
</form>
